when:
  - event: manual
  - event: cron

clone:
  git:
    image: woodpeckerci/plugin-git:2.11.0@sha256:9802cb7852dcf31f9c5c1d1ddeadfb9002d4fae85751f7b6a792eedb267bcc59
    settings:
      lfs: false
      tags: false

steps:
  - name: sync-github-mirrors
    image: dhi.io/node:26.12.1-alpine3.24-dev@sha256:0614d22bcdfe1f5fbf985e68b455e61aefba8bc697894a6e91a8542a3e5f26b4
    environment:
      FORGEJO_PUSH_TOKEN:
        from_secret: forgejo_profile_push_token
      FORGEJO_PUSH_USER: m0sh1
      GITHUB_PUSH_TOKEN:
        from_secret: github_push_token
    commands:
      - apk add --no-cache ca-certificates git
      - node scripts/sync-github-mirrors.mjs
    when:
      - event: manual
      - event: cron
