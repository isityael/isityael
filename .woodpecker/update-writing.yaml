when:
  - event: manual
    branch: main
  - event: cron
    branch: main

clone:
  git:
    image: woodpeckerci/plugin-git:2.10.1@sha256:550075c844fcec0af41d9d28f9860aa5d8c43e1e9419be4b9266dc02c2f29804
    settings:
      lfs: false
      tags: false

steps:
  - name: validate-recent-writing
    image: &node-image dhi.io/node:26.10.0-alpine3.24-dev@sha256:ff2c07e1681b1bcf1747b55ed54b900a327602a37975fb77487e2f795e822dfd
    commands:
      - node --test scripts/update-recent-writing.test.mjs

  - name: update-recent-writing
    image: *node-image
    commands:
      - node scripts/update-recent-writing.mjs
    when:
      - event: manual
      - event: cron

  - name: push-readme
    image: *node-image
    environment:
      GIT_PUSH_TOKEN:
        from_secret: forgejo_profile_push_token
      GIT_PUSH_USER: m0sh1
    commands:
      - |
        if git diff --quiet -- README.md; then
          echo "README.md already has the latest writing."
          exit 0
        fi
      - git config user.name "woodpecker-profile-bot"
      - git config user.email "woodpecker@m0sh1.cc"
      - git add README.md
      - 'git commit -m "chore: update recent writing"'
      - |
        test -n "$GIT_PUSH_TOKEN"
        umask 077
        cat > "$HOME/.netrc" <<EOF
        machine git.m0sh1.cc
          login ${GIT_PUSH_USER}
          password ${GIT_PUSH_TOKEN}
        EOF
      - git push origin HEAD:main
    when:
      - event: manual
      - event: cron
