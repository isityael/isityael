when:
  - event: manual
  - event: cron

clone:
  git:
    image: woodpeckerci/plugin-git:2.11.0
    settings:
      lfs: false
      tags: false

steps:
  - name: sync-github-mirrors
    image: dhi.io/node:26.13.0-alpine3.24-dev
    environment:
      FORGEJO_PUSH_TOKEN:
        from_secret: forgejo_profile_push_token
      FORGEJO_PUSH_USER: m0sh1
      GITHUB_PUSH_TOKEN:
        from_secret: github_push_token
    commands:
      - apk add --no-cache ca-certificates git
      - node scripts/sync-github-mirrors.mjs
    when:
      - event: manual
      - event: cron
