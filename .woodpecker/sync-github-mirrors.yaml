when:
  - event: manual
  - event: cron
  - event: push
    branch: main
  - event: pull_request
    branch: main

clone:
  git:
    image: woodpeckerci/plugin-git:2.10.1@sha256:550075c844fcec0af41d9d28f9860aa5d8c43e1e9419be4b9266dc02c2f29804
    settings:
      lfs: false
      tags: false

steps:
  - name: validate-mirror-config
    image: &node-image dhi.io/node:26.10.0-alpine3.24-dev@sha256:ff2c07e1681b1bcf1747b55ed54b900a327602a37975fb77487e2f795e822dfd
    commands:
      - node --check scripts/sync-github-mirrors.mjs
    when:
      - event: [push, pull_request]

  - name: sync-github-mirrors
    image: *node-image
    environment:
      FORGEJO_PUSH_TOKEN:
        from_secret: forgejo_profile_push_token
      FORGEJO_PUSH_USER: m0sh1
      GITHUB_PUSH_TOKEN:
        from_secret: github_push_token
    commands:
      - apk add --no-cache ca-certificates git
      - node scripts/sync-github-mirrors.mjs
    when:
      - event: manual
      - event: cron
