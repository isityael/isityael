when:
  - event: manual
    branch: main
  - event: cron
    branch: main

clone:
  git:
    image: woodpeckerci/plugin-git:2.11.0@sha256:9802cb7852dcf31f9c5c1d1ddeadfb9002d4fae85751f7b6a792eedb267bcc59
    settings:
      lfs: false
      tags: false

steps:
  - name: validate-recent-writing
    image: &node-image dhi.io/node:26.12.1-alpine3.24-dev@sha256:0614d22bcdfe1f5fbf985e68b455e61aefba8bc697894a6e91a8542a3e5f26b4
    commands:
      - node --test scripts/update-recent-writing.test.mjs

  - name: update-recent-writing
    image: *node-image
    commands:
      - node scripts/update-recent-writing.mjs
    when:
      - event: manual
      - event: cron

  - name: push-readme
    image: *node-image
    environment:
      GIT_PUSH_TOKEN:
        from_secret: forgejo_profile_push_token
      GIT_PUSH_USER: m0sh1
    commands:
      - |
        if git diff --quiet -- README.md; then
          echo "README.md already has the latest writing."
          exit 0
        fi
      - git config user.name "woodpecker-profile-bot"
      - git config user.email "woodpecker@m0sh1.cc"
      - git add README.md
      - 'git commit -m "chore: update recent writing"'
      - |
        test -n "$GIT_PUSH_TOKEN"
        umask 077
        cat > "$HOME/.netrc" <<EOF
        machine git.m0sh1.cc
          login ${GIT_PUSH_USER}
          password ${GIT_PUSH_TOKEN}
        EOF
      - git push origin HEAD:main
    when:
      - event: manual
      - event: cron
